[build]
  command = "pnpm build"
  publish = ".next"

[redirects]
  # Handle admin route rewrites (similar to vercel.json)
  { from = "/admin/*", to = "/dashboard/admin/:splat", status = 200 }
  { from = "/admin", to = "/dashboard/admin", status = 200 }
  { from = "/terms", to = "/terms-of-service", status = 200 }

[[headers]]
  # Define headers for specific paths
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
